<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon/favicon.ico}">
    <link th:href="@{/styles/style.css}" rel="stylesheet">
</head>
<body>
  <div class="page-header">
    <img id="main-logo" th:src="@{/images/Caffeine-logo-bg.png}" />
  </div>
  <div class="navbar">
    <form th:action="@{/}" method="GET"><button>Home</button></form>
    <form th:action="@{/design}" method="GET"><button>Order Coffee</button></form>
    <form th:action="@{/}" method="GET"><button>About us</button></form>
    <form th:action="@{/contact}" method="GET"><button>Contact</button></form>
  </div>
  <div class="container">
    <div class="main" >
      <h1>Login</h1>

      <div th:if="${error}">
        Unable to login. Check your username and password.
      </div>

      <form method="POST" th:action="@{/login}" id="loginForm">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="input-container">
          <input type="text" name="username" required="">
          <label th:for="username" class="label">Username</label>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="password" name="password" required="">
          <label th:for="password" class="label">Password</label>
          <div class="underline"></div>
        </div>

        <button class="green-button" type="submit" value="Login">Login</button>

      </form>

      <p><h3>New here?</h3></p>
      <a th:href="@{/register}"><button class="green-button">Click to register</button></a>

      <h3>or Login via Github account:</h3>
      <a href="/oauth2/authorization/github">
      <button class="btn">
        <svg width="40" height="40" fill="#0b6e0e" xmlns="http://www.w3.org/2000/svg" data-name="Layer 1" viewBox="0 0 24 24" id="github">
          <path d="M12,2.2467A10.00042,10.00042,0,0,0,8.83752,21.73419c.5.08752.6875-.21247.6875-.475,0-.23749-.01251-1.025-.01251-1.86249C7,19.85919,6.35,18.78423,6.15,18.22173A3.636,3.636,0,0,0,5.125,16.8092c-.35-.1875-.85-.65-.01251-.66248A2.00117,2.00117,0,0,1,6.65,17.17169a2.13742,2.13742,0,0,0,2.91248.825A2.10376,2.10376,0,0,1,10.2,16.65923c-2.225-.25-4.55-1.11254-4.55-4.9375a3.89187,3.89187,0,0,1,1.025-2.6875,3.59373,3.59373,0,0,1,.1-2.65s.83747-.26251,2.75,1.025a9.42747,9.42747,0,0,1,5,0c1.91248-1.3,2.75-1.025,2.75-1.025a3.59323,3.59323,0,0,1,.1,2.65,3.869,3.869,0,0,1,1.025,2.6875c0,3.83747-2.33752,4.6875-4.5625,4.9375a2.36814,2.36814,0,0,1,.675,1.85c0,1.33752-.01251,2.41248-.01251,2.75,0,.26251.1875.575.6875.475A10.0053,10.0053,0,0,0,12,2.2467Z"></path>
        </svg>
      </button>
      </a>

    </div>
  </div>
  <div class="footer">
    <p>Created by Kierznowski</p>
  </div>
</body>
</html>
