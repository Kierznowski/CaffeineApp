<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Order coffee</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon/favicon.ico}">
    <link th:href="@{/styles/style.css}" rel="stylesheet">
</head>

<body>
    <div class="page-header">
        <img id="main-logo" th:src="@{/images/Caffeine-logo-bg.png}" />
    </div>
    <div class="navbar">
        <form th:action="@{/}" method="GET"><button>Home</button></form>
        <form th:action="@{/design}" method="GET"><button>Order Coffee</button></form>
        <form th:action="@{/}" method="GET"><button>About us</button></form>
        <form th:action="@{/contact}" method="GET"><button>Contact</button></form>

        <span sec:authorize="hasRole('ROLE_USER')">
            <form  method="POST" th:action="@{/logout}" id="logout">
                <input type="submit" value="Logout">
            </form>
        </span>

        <span sec:authorize="!hasRole('ROLE_USER')">
            <form  method="POST" th:action="@{/login}" id="login">
                <input type="submit" value="Log in">
            </form>
        </span>
    </div>

    <div class="container">
        <main class="main">
            <div class="order-form">
                <form method="POST" th:action="@{/orders}" th:object="${coffeeOrder}">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <h2>Deliver my order to:</h2>
                    <div class="input-container">
                        <input type="text" th:field="*{deliveryName}" required="">
                        <label th:for="deliveryName" class="label">Name: </label>
                        <div class="underline"></div>
                    </div>
                    <span class="deliveryName"
                          th:if = "${#fields.hasErrors('deliveryName')}"
                          th:errors="*{deliveryName}">Delivery name Error</span>

                    <div class="input-container">
                        <input type="text" th:field="*{deliveryStreet}" required="">
                        <label th:for="deliveryStreet" class="label">Street: </label>
                        <div class="underline"></div>
                    </div>
                    <span class="validationError"
                          th:if = "${#fields.hasErrors('deliveryStreet')}"
                          th:errors="*{deliveryStreet}">Street Error</span>

                    <div class="input-container">
                        <input type="text" th:field="*{deliveryCity}" required="">
                        <label th:for="deliveryCity" class="label">City: </label>
                        <div class="underline"></div>
                    </div>
                    <span class="validationError"
                          th:if = "${#fields.hasErrors('deliveryCity')}"
                          th:errors="*{deliveryCity}">City Error</span>

                    <div class="input-container">
                        <input type="text" th:field="*{deliveryZip}" required="">
                        <label th:for="deliveryZip" class="label">Zip code: </label>
                        <div class="underline"></div>
                    </div>
                    <span class="validationError"
                          th:if = "${#fields.hasErrors('deliveryZip')}"
                          th:errors="*{deliveryZip}">Delivery Zip Error</span>
                    <br/>

                <h2>Payment:</h2>
                    <div class="input-container">
                        <input type="text" th:field="*{ccNumber}" required="">
                        <label th:for="ccNumber" class="label">Credit Card number: </label>
                        <div class="underline"></div>
                        <span class="tooltip">
                            <div class="icon">i</div>
                            <div class="tooltiptext">You can use 20 times the same digit</div>
                        </span>
                    </div>
                    <span class="validationError"
                          th:if = "${#fields.hasErrors('ccNumber')}"
                          th:errors="*{ccNumber}">CC Num Error</span>

                    <div class="input-container">
                        <input type="text" th:field="*{ccExpiration}" required="">
                        <label th:for="ccExpiration" class="label">Expiration: </label>
                        <div class="underline"></div>
                    </div>

                    <span class="validationError"
                          th:if = "${#fields.hasErrors('ccExpiration')}"
                          th:errors="*{ccExpiration}">CC Expiration Error</span>

                    <div class="input-container">
                        <input type="text" th:field="*{ccCVV}" required="">
                        <label th:for="ccCVV" class="label">CVV: </label>
                        <div class="underline"></div>
                    </div>
                    <span class="validationError"
                          th:if = "${#fields.hasErrors('ccCVV')}"
                          th:errors="*{ccCVV}">CVV Error</span>

                    <span><button class="green-button" type="submit" value="Submit Order">Submit Order</button></span>
                </form>
            </div>
            <div class="coffees-in-order">
                <h2>Coffees in the order:</h2>
                <ul>
                    <li th:each="coffee : ${coffeeOrder.coffees}">
                        <span th:text="${coffee.name}">coffee name</span>
                    </li>
                </ul>
                <a th:href="@{/design}" class="green-button" id="another">Design another coffee</a>
            </div>

        </main>
    </div>
    <div class="footer">
        Created by Kierznowski
    </div>
</body>
</html>
