<!DOCTYPE html>
<html lang="en" xmlns:th="httsp://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Register User</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon/favicon.ico}">
    <link th:href="@{/styles/style.css}" rel="stylesheet">
</head>

<body>
    <div class="page-header">
        <img id="main-logo" th:src="@{/images/Caffeine-logo-bg.png}" />
    </div>

    <div class="navbar">
        <form th:action="@{/}" method="GET"><button>Home</button></form>
        <form th:action="@{/design}" method="GET"><button>Order Coffee</button></form>
        <form th:action="@{/}" method="GET"><button>About us</button></form>
        <form th:action="@{/contact}" method="GET"><button>Contact</button></form>
        <span sec:authorize="hasRole('ROLE_USER')">
                <form  method="POST" th:action="@{/logout}" id="logout">
                    <button type="submit"><label>Log out</label></button>
                </form>
            </span>

        <span sec:authorize="!hasRole('ROLE_USER')">
                <form  method="POST" th:action="@{/login}" id="login">
                    <button type="submit"><label>Log in</label></button>
                </form>
        </span>
    </div>
    <div class="container">
        <div class="main">
            <h1>Register user</h1>

            <form method="POST" th:action="@{/register}" id="registerForm">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="input-container">
                    <input type="text" name="username" required="">
                    <label th:for="username" class="label">Username</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="password" name="password" required="">
                    <label th:for="password" class="label">Password</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="password" name="confirm" required="">
                    <label th:for="confirm" class="label">Confirm password</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="text" name="fullname" required="">
                    <label th:for="fullname" class="label">Full name</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="text" name="street" required="">
                    <label th:for="street" class="label">Street</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="text" name="city" required="">
                    <label th:for="city" class="label">City</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="text" name="zip" required="">
                    <label th:for="zip" class="label">Zip</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="text" name="phone" required="">
                    <label th:for="phone" class="label">Phone number</label>
                    <div class="underline"></div>
                </div>

                <button class="green-button" type="submit" value="Register">Register</button>

            </form>
        </div>
    </div>
    <div class="footer">
        <p>Created by Kierznowski</p>
    </div>
</body>
</html>
